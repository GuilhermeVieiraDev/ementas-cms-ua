services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: ementas-api:local
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CACHE_TTL_MS: "${CACHE_TTL_MS:-600000}"
      STALE_CACHE_MAX_AGE_MS: "${STALE_CACHE_MAX_AGE_MS:-21600000}"
      CMS_UA_USERNAME: "${CMS_UA_USERNAME:-}"
      CMS_UA_PASSWORD: "${CMS_UA_PASSWORD:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:3000}"
    image: ementas-web:local
    ports:
      - "${WEB_PORT:-5173}:5173"
    restart: unless-stopped
